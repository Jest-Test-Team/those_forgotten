services:
  api:
    environment:
      APP_ENV: production
      PORT: ${API_PORT:-8080}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      INTERNAL_INGEST_TOKEN: ${INTERNAL_INGEST_TOKEN:?set INTERNAL_INGEST_TOKEN}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?set SUPABASE_JWT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      STRIPE_CHECKOUT_BASE_URL: ${STRIPE_CHECKOUT_BASE_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-}
      STRIPE_MEMBERSHIP_PRICE_ID: ${STRIPE_MEMBERSHIP_PRICE_ID:-}
      STRIPE_COURSE_PRICE_ID: ${STRIPE_COURSE_PRICE_ID:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      GRPC_PORT: ${GRPC_PORT:-9090}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-5}
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    environment:
      PORT: ${WEB_PORT:-3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set NEXT_PUBLIC_API_BASE_URL}
      API_BASE_URL: ${API_BASE_URL:-${NEXT_PUBLIC_API_BASE_URL}}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SUPABASE_AUTH_REDIRECT: ${NEXT_PUBLIC_SUPABASE_AUTH_REDIRECT:-/auth/callback}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "${WEB_PORT:-3000}:3000"

  crawler:
    environment:
      POST_TO_API: ${POST_TO_API:-true}
      FIXTURES: ${CRAWLER_FIXTURES:-fixtures}
      INGEST_URL: ${INGEST_URL:-http://api:8080/internal/ingest/auctions}
      INTERNAL_INGEST_TOKEN: ${INTERNAL_INGEST_TOKEN:?set INTERNAL_INGEST_TOKEN}

  postgres:
    ports: []

  redis:
    ports: []

  redpanda:
    ports: []
