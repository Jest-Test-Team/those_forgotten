name: Deploy Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    if: ${{ vars.API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/smoke-check.sh
      - run: ./scripts/smoke-check.sh
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
