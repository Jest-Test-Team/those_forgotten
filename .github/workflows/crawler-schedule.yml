name: Crawler Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  crawl-and-ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/crawler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install crawler
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Dry run with fixtures when ingest secrets are missing
        if: ${{ secrets.CRAWLER_INGEST_ENDPOINT == '' || secrets.CRAWLER_INGEST_TOKEN == '' }}
        run: python -m crawler.cli --fixtures fixtures

      - name: Post normalized payload to API
        if: ${{ secrets.CRAWLER_INGEST_ENDPOINT != '' && secrets.CRAWLER_INGEST_TOKEN != '' }}
        env:
          INGEST_ENDPOINT: ${{ secrets.CRAWLER_INGEST_ENDPOINT }}
          INTERNAL_INGEST_TOKEN: ${{ secrets.CRAWLER_INGEST_TOKEN }}
        run: python -m crawler.cli --fixtures fixtures --post --endpoint "$INGEST_ENDPOINT" --token "$INTERNAL_INGEST_TOKEN"
