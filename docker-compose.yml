services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: customs
      POSTGRES_USER: customs
      POSTGRES_PASSWORD: customs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customs -d customs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment:
      PORT: "8080"
      WEB_ORIGIN: http://localhost:3000
      INTERNAL_INGEST_TOKEN: demo-token
      DATABASE_URL: postgres://customs:customs@postgres:5432/customs?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    environment:
      PORT: "3000"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  crawler:
    build:
      context: .
      dockerfile: infra/Dockerfile.crawler
    environment:
      POST_TO_API: "true"
      FIXTURES: fixtures
      INGEST_ENDPOINT: http://api:8080/internal/ingest/auctions
      INTERNAL_INGEST_TOKEN: demo-token
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
