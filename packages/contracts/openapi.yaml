openapi: 3.1.0
info:
  title: Customs Auction Platform API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Service health check
      operationId: getHealth
      responses:
        "200":
          description: Health payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/auctions:
    get:
      summary: List auction lots
      operationId: listAuctions
      responses:
        "200":
          description: Auction list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuctionLot"
  /v1/auctions/{id}:
    get:
      summary: Get auction lot detail
      operationId: getAuction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Auction detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AuctionLot"
  /v1/auctions/{id}/history:
    get:
      summary: Get historical result snapshots
      operationId: getAuctionHistory
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: History rows
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuctionResult"
  /v1/auctions/calendar.ics:
    get:
      summary: Get personalized ICS feed
      operationId: getCalendarFeed
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Calendar feed
          content:
            text/calendar:
              schema:
                type: string
        "401":
          description: Calendar token required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/keyword-subscriptions:
    get:
      summary: List keyword subscriptions
      operationId: listKeywordSubscriptions
      responses:
        "200":
          description: Keyword subscriptions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/KeywordSubscription"
    post:
      summary: Create keyword subscription
      operationId: createKeywordSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeywordSubscriptionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordSubscriptionResponse"
  /v1/keyword-subscriptions/{id}:
    delete:
      summary: Delete keyword subscription
      operationId: deleteKeywordSubscription
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /v1/web-push-subscriptions:
    post:
      summary: Save a web push subscription
      operationId: createWebPushSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebPushSubscriptionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebPushSubscriptionResponse"
  /v1/knowledge/articles/{slug}:
    get:
      summary: Get a knowledge article
      operationId: getKnowledgeArticle
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Article detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/KnowledgeArticle"
  /v1/courses:
    get:
      summary: List courses
      operationId: listCourses
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Course"
  /v1/stripe/checkout:
    post:
      summary: Create Stripe checkout session
      operationId: createCheckoutSession
      requestBody:
        required: false
      responses:
        "200":
          description: Checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
  /v1/stripe/webhook:
    post:
      summary: Receive Stripe webhooks
      operationId: stripeWebhook
      responses:
        "200":
          description: Webhook processed
  /v1/community/posts:
    get:
      summary: List community posts
      operationId: listCommunityPosts
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommunityPost"
    post:
      summary: Create a community post
      operationId: createCommunityPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CommunityPost"
  /v1/community/posts/{id}/report:
    post:
      summary: Report a community post
      operationId: reportCommunityPost
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CommunityReport"
  /v1/admin/community-reports:
    get:
      summary: List community moderation reports
      operationId: listCommunityReports
      responses:
        "200":
          description: Moderation reports
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommunityReport"
  /v1/admin/crawler-status:
    get:
      summary: List crawler office status
      operationId: listCrawlerStatuses
      responses:
        "200":
          description: Crawler statuses
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CrawlerStatus"
  /v1/advisors:
    get:
      summary: List advisors
      operationId: listAdvisors
      responses:
        "200":
          description: Advisors
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdvisorProfile"
  /v1/admin/advisor-leads:
    get:
      summary: List advisor lead queue
      operationId: listAdvisorLeads
      responses:
        "200":
          description: Advisor leads
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdvisorLead"
  /v1/advisor-leads:
    post:
      summary: Create advisor lead
      operationId: createAdvisorLead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvisorLeadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdvisorLead"
  /internal/ingest/auctions:
    post:
      summary: Ingest normalized crawler payloads
      operationId: ingestAuctions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestPayload"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/IngestResponse"
components:
  schemas:
    AuctionLot:
      type: object
      required: [id, title, customsOffice, closingAt, viewingAt, officialUrl, summary, disclaimers]
      properties:
        id:
          type: string
        title:
          type: string
        customsOffice:
          type: string
        closingAt:
          type: string
          format: date-time
        viewingAt:
          type: string
          format: date-time
        category:
          type: string
        officialUrl:
          type: string
        summary:
          type: string
        disclaimers:
          type: array
          items:
            type: string
    AuctionResult:
      type: object
      required: [id, finalPrice, recordedAt]
      properties:
        id:
          type: string
        finalPrice:
          type: integer
        recordedAt:
          type: string
          format: date-time
    KeywordSubscriptionInput:
      type: object
      required: [keyword]
      properties:
        keyword:
          type: string
    KeywordSubscriptionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/KeywordSubscription"
    KeywordSubscription:
      type: object
      required: [id, keyword]
      properties:
        id:
          type: string
        keyword:
          type: string
    WebPushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
            auth:
              type: string
    WebPushSubscriptionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, endpoint, keys]
          properties:
            id:
              type: string
            endpoint:
              type: string
            keys:
              type: object
              additionalProperties: true
    KnowledgeArticle:
      type: object
      required: [slug, title, summary]
      properties:
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
    Course:
      type: object
      required: [id, title, description]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
    CheckoutSessionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [provider, url]
          properties:
            provider:
              type: string
            url:
              type: string
    CommunityPostInput:
      type: object
      required: [title, body, office]
      properties:
        title:
          type: string
        body:
          type: string
        office:
          type: string
        lot_id:
          type: string
        author:
          type: string
        image_urls:
          type: array
          items:
            type: string
    CommunityPost:
      type: object
      required: [id, title, body, office, author, visible]
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        office:
          type: string
        author:
          type: string
        visible:
          type: boolean
        images:
          type: array
          items:
            type: string
    CommunityReportInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    CommunityReport:
      type: object
      required: [id, postId, reason, status, createdAt]
      properties:
        id:
          type: string
        postId:
          type: string
        postTitle:
          type: string
        office:
          type: string
        reason:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    AdvisorProfile:
      type: object
      required: [id, name, specialty, description]
      properties:
        id:
          type: string
        name:
          type: string
        specialty:
          type: string
        description:
          type: string
    AdvisorLeadInput:
      type: object
      required: [advisor_id, name, email, message]
      properties:
        advisor_id:
          type: string
        name:
          type: string
        email:
          type: string
        message:
          type: string
        category:
          type: string
    AdvisorLead:
      type: object
      required: [id, advisorId, name, email, message]
      properties:
        id:
          type: string
        advisorId:
          type: string
        advisorName:
          type: string
        name:
          type: string
        email:
          type: string
        message:
          type: string
        category:
          type: string
        createdAt:
          type: string
          format: date-time
    CrawlerStatus:
      type: object
      required: [office, status, lastRunAt, nextRunAt, lastChecksum, lastRowCount, triggerSource]
      properties:
        office:
          type: string
        status:
          type: string
        lastRunAt:
          type: string
          format: date-time
        nextRunAt:
          type: string
          format: date-time
        lastChecksum:
          type: string
        lastRowCount:
          type: integer
        triggerSource:
          type: string
    IngestPayload:
      type: object
      required: [source, checksum, rows]
      properties:
        source:
          type: string
        checksum:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/NormalizedAuction"
    NormalizedAuction:
      type: object
      required: [announcement_no, office, title, category, closing_at, original_link, warnings]
      properties:
        announcement_no:
          type: string
        office:
          type: string
        title:
          type: string
        category:
          type: string
        closing_at:
          type: string
        original_link:
          type: string
        warnings:
          type: array
          items:
            type: string
    IngestResponse:
      type: object
      required: [source, checksum, received]
      properties:
        source:
          type: string
        checksum:
          type: string
        received:
          type: integer
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthResponse:
      type: object
      required: [status, repository]
      properties:
        status:
          type: string
        repository:
          type: string
