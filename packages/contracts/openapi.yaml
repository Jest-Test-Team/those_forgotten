openapi: 3.1.0
info:
  title: Customs Auction Platform API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /v1/auctions:
    get:
      summary: List auction lots
      operationId: listAuctions
      responses:
        "200":
          description: Auction list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuctionLot"
  /v1/auctions/{id}:
    get:
      summary: Get auction lot detail
      operationId: getAuction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Auction detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AuctionLot"
  /v1/auctions/{id}/history:
    get:
      summary: Get historical result snapshots
      operationId: getAuctionHistory
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: History rows
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuctionResult"
  /v1/auctions/calendar.ics:
    get:
      summary: Get personalized ICS feed
      operationId: getCalendarFeed
      responses:
        "200":
          description: Calendar feed
          content:
            text/calendar:
              schema:
                type: string
  /v1/keyword-subscriptions:
    post:
      summary: Create keyword subscription
      operationId: createKeywordSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeywordSubscriptionInput"
      responses:
        "201":
          description: Created
  /v1/keyword-subscriptions/{id}:
    delete:
      summary: Delete keyword subscription
      operationId: deleteKeywordSubscription
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /v1/web-push-subscriptions:
    post:
      summary: Save a web push subscription
      operationId: createWebPushSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebPushSubscriptionInput"
      responses:
        "201":
          description: Created
  /v1/knowledge/articles/{slug}:
    get:
      summary: Get a knowledge article
      operationId: getKnowledgeArticle
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Article detail
  /v1/courses:
    get:
      summary: List courses
      operationId: listCourses
      responses:
        "200":
          description: Courses
  /v1/stripe/checkout:
    post:
      summary: Create Stripe checkout session
      operationId: createCheckoutSession
      responses:
        "200":
          description: Checkout session
  /v1/stripe/webhook:
    post:
      summary: Receive Stripe webhooks
      operationId: stripeWebhook
      responses:
        "200":
          description: Webhook processed
  /v1/community/posts:
    get:
      summary: List community posts
      operationId: listCommunityPosts
      responses:
        "200":
          description: Posts
    post:
      summary: Create a community post
      operationId: createCommunityPost
      responses:
        "201":
          description: Created
  /v1/community/posts/{id}/report:
    post:
      summary: Report a community post
      operationId: reportCommunityPost
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Created
  /v1/advisors:
    get:
      summary: List advisors
      operationId: listAdvisors
      responses:
        "200":
          description: Advisors
  /v1/advisor-leads:
    post:
      summary: Create advisor lead
      operationId: createAdvisorLead
      responses:
        "201":
          description: Created
  /internal/ingest/auctions:
    post:
      summary: Ingest normalized crawler payloads
      operationId: ingestAuctions
      responses:
        "202":
          description: Accepted
components:
  schemas:
    AuctionLot:
      type: object
      required: [id, title, customsOffice, closingAt, disclaimers]
      properties:
        id:
          type: string
        title:
          type: string
        customsOffice:
          type: string
        closingAt:
          type: string
          format: date-time
        category:
          type: string
        disclaimers:
          type: array
          items:
            type: string
    AuctionResult:
      type: object
      required: [id, finalPrice, recordedAt]
      properties:
        id:
          type: string
        finalPrice:
          type: integer
        recordedAt:
          type: string
          format: date-time
    KeywordSubscriptionInput:
      type: object
      required: [keyword]
      properties:
        keyword:
          type: string
    WebPushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
            auth:
              type: string
